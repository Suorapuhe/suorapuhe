<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="320" height="460">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2d1f05"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e6c46e"/>
      <stop offset="100%" style="stop-color:#c79a3a"/>
    </linearGradient>
  </defs>
  <rect width="320" height="460" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="460" fill="url(#gold)"/>
  <rect x="312" y="0" width="8" height="460" fill="url(#gold)"/>
  <rect x="8" y="0" width="304" height="6" fill="url(#gold)"/>
  <rect x="8" y="454" width="304" height="6" fill="url(#gold)"/>
  <!-- Koristeviiva -->
  <rect x="20" y="18" width="280" height="1" fill="#c79a3a" opacity="0.5"/>
  <rect x="20" y="441" width="280" height="1" fill="#c79a3a" opacity="0.5"/>
  <!-- Kirjailija -->
  <text x="160" y="52" font-family="Georgia,serif" font-size="13" fill="#c79a3a" text-anchor="middle" letter-spacing="3">MASSIKEIMO</text>
  <!-- Pääotsikko -->
  <text x="160" y="200" font-family="Georgia,serif" font-size="42" fill="#fff" text-anchor="middle" font-weight="bold">VAURAS-</text>
  <text x="160" y="252" font-family="Georgia,serif" font-size="42" fill="#fff" text-anchor="middle" font-weight="bold">TUMISEN</text>
  <text x="160" y="304" font-family="Georgia,serif" font-size="42" fill="url(#gold)" text-anchor="middle" font-weight="bold">HARHA</text>
  <!-- Alaviivoitus -->
  <rect x="100" y="320" width="120" height="2" fill="url(#gold)"/>
  <!-- Alaotsikko -->
  <text x="160" y="360" font-family="Arial,sans-serif" font-size="11" fill="#aaa" text-anchor="middle">Miksi suomalaiset luulevat</text>
  <text x="160" y="378" font-family="Arial,sans-serif" font-size="11" fill="#aaa" text-anchor="middle">vaurastuvansa — ja miksi eivät.</text>
  <!-- Kustantaja -->
  <text x="160" y="430" font-family="Arial,sans-serif" font-size="10" fill="#666" text-anchor="middle" letter-spacing="1">BOD 2026</text>
</svg>